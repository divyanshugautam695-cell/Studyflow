name: Build StudyFlow APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StudyFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyFlow-Android-APK
          path: StudyFlow.apk
          if-no-files-found: error

      - name: Publish downloadable GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: studyflow-apk-${{ github.run_number }}
          name: StudyFlow APK ${{ github.run_number }}
          generate_release_notes: true
          files: StudyFlow.apk
